name: CI - Full-Stack Build y Tests (Pausa Web)

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  frontend-ci:
    name: CI Frontend (Angular)
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout del código
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 3. Instalar dependencias
        run: npm ci

      - name: 4. Ejecutar pruebas unitarias Angular
        run: npx ng test --no-watch

      - name: 5. Compilar Frontend (Production Build)
        run: npm run build -- --configuration production

  backend-ci:
    name: CI Backend (Spring Boot - Java 21)
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout del código
        uses: actions/checkout@v4

      - name: 2. Configurar Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: 3. Compilar y verificar con Maven
        working-directory: ./backend
        env:
          DB_URL: jdbc:postgresql://localhost:5432/testdb
          DB_USERNAME: test
          DB_PASSWORD: test
        run: mvn clean verify -Dspring.profiles.active=test || mvn clean package -DskipTests